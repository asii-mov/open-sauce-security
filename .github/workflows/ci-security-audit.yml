# Open Sauce — CI Security Audit
# Runs zizmor (GitHub Actions static analysis) and pinact (action SHA-pinning check)
# on every PR that touches workflow files, plus a weekly scheduled scan.
#
# Drop this file into your repo's .github/workflows/ directory.

name: CI Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "action.yml"
      - "action.yaml"
  schedule:
    # Weekly Monday 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zizmor
        # Pin to a specific version — update periodically
        run: |
          pip install 'zizmor>=1.6,<2'

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zizmor --format sarif . > results.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always()
        with:
          sarif_file: results.sarif
          category: zizmor

  pinact:
    name: Check action pinning (pinact)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run pinact
        uses: suzuki-shunsuke/pinact-action@062cd1e8227d32dd4a7a50b56eabcbd5bc498e3f # v1.1.0
        with:
          check: "true"
