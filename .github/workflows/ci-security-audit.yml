# Open Sauce — CI Security Audit
# Runs zizmor (GitHub Actions static analysis) and pinact (action SHA-pinning check)
# on every PR that touches workflow files, plus a weekly scheduled scan.
#
# Drop this file into your repo's .github/workflows/ directory.

name: CI Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "action.yml"
      - "action.yaml"
  schedule:
    # Weekly Monday 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          version: 1.23.1
          # Upload SARIF to the Security tab and continue on findings
          advanced-security: "true"

  pinact:
    name: Check action pinning (pinact)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinact
        # Go is pre-installed on ubuntu-latest; pin to a specific version.
        run: go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@v3.9.0

      - name: Check all actions are SHA-pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ~/go/bin/pinact run --check --diff .github/workflows/*.yml
