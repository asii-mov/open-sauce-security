# Open Sauce — OpenSSF Scorecard
# Runs the OpenSSF Scorecard against your repo and publishes results
# to the GitHub Security tab as SARIF. Helps track your security posture
# across branch protection, dependency pinning, SAST, token permissions, etc.
#
# Drop this file into your repo's .github/workflows/ directory.
#
# Prerequisites:
#   - Enable "Dependency graph" in repo Settings > Code security
#
# Note: For deeper checks (e.g., Webhooks, Branch-Protection on private repos),
# Scorecard recommends a classic PAT. For public repos the default GITHUB_TOKEN
# is sufficient and keeps the workflow simple.

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
      id-token: write         # For Scorecard OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
          category: scorecard
