# Copy this file to .github/dependabot.yml in your repository.
# Customize the package ecosystems and directories for your project.
#
# Cooldowns delay updates after a package release — this protects against
# compromised packages by giving the community time to detect and pull them
# before your repo adopts them.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions — keep workflows pinned to latest
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # GitHub Actions doesn't support semver-* cooldown fields; only default-days.
    cooldown:
      default-days: 7
    # Group minor/patch updates into a single PR
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"

