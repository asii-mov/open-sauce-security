# Open Sauce — Hardened Release Workflow
# A security-hardened release workflow template. Adapt to your project's
# build system and package registry.
#
# Security features:
#   - Minimal permissions (explicit per-job grants)
#   - Dedicated "release" environment with manual approval gate
#   - Sigstore attestation for provenance
#   - No caching (prevents cache poisoning)
#   - Trusted publishing via OIDC (no long-lived registry credentials)
#   - Immutable release tags (configure via repo/org rulesets)
#
# Drop this file into your repo's .github/workflows/ directory and customize
# the build steps for your project.
#
# Prerequisites:
#   - Create a "release" environment in repo Settings > Environments
#   - Add required reviewers to the "release" environment
#   - Restrict deployment to the main branch only
#   - For PyPI: configure Trusted Publishing at pypi.org/manage/project/.../settings/publishing/
#   - For npm: configure provenance in package.json or use --provenance flag
#   - For crates.io: configure Trusted Publishing in crate settings

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # -------------------------------------------------------------------
  # Gate: build and test WITHOUT release credentials
  # -------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ---- Customize: your build steps here ----
      # Example for Python:
      # - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      # - run: uv build
      #
      # Example for Node.js:
      # - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      #   with:
      #     node-version: "22"
      # - run: npm ci && npm test && npm run build
      #
      # Example for Rust:
      # - run: cargo test --release && cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          # NOTE: Do NOT enable caching in release jobs (cache poisoning risk)

  # -------------------------------------------------------------------
  # Publish: runs in the protected "release" environment
  # -------------------------------------------------------------------
  publish:
    name: Publish release
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: release  # Requires manual approval + branch restriction
    permissions:
      contents: write     # For GitHub release creation
      id-token: write     # For OIDC trusted publishing + Sigstore
      attestations: write # For artifact attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/

      # ---- Sigstore attestation for provenance ----
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: "dist/*"

      # ---- Customize: your publish steps here ----
      #
      # Python (PyPI Trusted Publishing — no token needed):
      # - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      # - run: uv publish
      #
      # Node.js (npm provenance):
      # - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      #   with:
      #     node-version: "22"
      #     registry-url: "https://registry.npmjs.org"
      # - run: npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #
      # Rust (crates.io):
      # - run: cargo publish
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # ---- Create GitHub Release ----
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --generate-notes \
            dist/*
